<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪜 Climbing the DROPped Ladder</title>
<style>
@font-face {
  font-family: 'RuneScape';
  src: url('https://cdn.jsdelivr.net/gh/runelite/runelite@master/runelite-client/src/main/resources/net/runelite/client/ui/runescape.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'RuneScape';
  src: url('https://cdn.jsdelivr.net/gh/runelite/runelite@master/runelite-client/src/main/resources/net/runelite/client/ui/runescape_bold.ttf') format('truetype');
  font-weight: bold;
  font-style: normal;
}

:root {
  --bg:      #0e0e0e;
  --bg2:     #141414;
  --panel:   #1a1a1a;
  --panel2:  #222222;
  --border:  #3a3a3a;
  --border2: #505050;
  --gold:    #FFB000;
  --gold2:   #cc8800;
  --text:    #e8e0c8;
  --text2:   #aaa090;
  --red:     #c03020;
  --green:   #3a9a30;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'RuneScape', sans-serif;
  font-weight: bold;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,.012) 40px, rgba(255,255,255,.012) 41px),
    repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,.012) 40px, rgba(255,255,255,.012) 41px);
  pointer-events: none; z-index: 0;
}

/* HOST BANNER */
#host-banner {
  display: none; background: var(--red);
  text-align: center; padding: 8px 16px;
  font-size: 15px; letter-spacing: 1px;
  position: sticky; top: 0; z-index: 300;
}
#host-banner.active { display: block; }

#host-btn {
  position: fixed; top: 12px; right: 16px; z-index: 400;
  background: var(--panel2); border: 1px solid var(--border2);
  color: var(--gold); padding: 7px 14px; border-radius: 5px;
  cursor: pointer; font-size: 13px;
}
#host-btn:hover { border-color: var(--gold); }

/* HEADER */
header {
  position: relative; z-index: 1;
  text-align: center; padding: 36px 16px 24px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #1a1a1a 0%, var(--bg) 100%);
}
header h1 {
  font-size: clamp(26px, 5vw, 52px);
  color: var(--gold);
  text-shadow: 0 0 20px rgba(255,176,0,.4), 2px 2px 0 #000;
  letter-spacing: 2px;
}
header .tagline { color: var(--text2); font-size: 18px; margin-top: 8px; letter-spacing: 1px; }
header .dates { color: var(--gold2); font-size: 18px; margin-top: 5px; }

/* COUNTDOWN */
#countdown-bar {
  background: var(--panel2); border-bottom: 1px solid var(--border);
  padding: 14px 16px; text-align: center;
}
#countdown-bar .label { font-size: 16px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
#countdown-digits { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.cd-unit { text-align: center; }
.cd-num {
  font-size: 36px; color: var(--gold);
  text-shadow: 0 0 10px rgba(255,176,0,.3);
  display: block; line-height: 1;
  background: var(--panel); border: 1px solid var(--border2);
  border-radius: 6px; padding: 4px 14px; min-width: 64px;
}
.cd-label { font-size: 14px; color: var(--text2); letter-spacing: 1px; margin-top: 4px; text-transform: uppercase; }
.started-msg { font-size: 20px; color: var(--green); letter-spacing: 2px; }

/* THREE-COLUMN LAYOUT: roster | ladder | roster */
.main-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 0;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 0 60px;
  position: relative; z-index: 1;
  align-items: start;
}
.main-layout > * { min-width: 0; }

/* ROSTERS PANEL (left column, all teams stacked) */
#rosters-panel {
  padding: 16px 12px;
  position: sticky;
  top: 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* SIDE ROSTERS */
.side-roster {
  padding: 0;
  border: 2px solid;
  border-radius: 8px;
  overflow: hidden;
}
.roster-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; cursor: pointer;
  user-select: none;
}
.roster-header:hover { background: rgba(255,255,255,.04); }
.roster-rank { font-size: 18px; margin-right: 4px; }
.roster-name { font-size: 18px; flex: 1; }
.roster-pts-badge {
  font-size: 16px; color: var(--text2);
  background: var(--panel2); border-radius: 6px;
  padding: 2px 8px; margin-left: 6px; white-space: nowrap;
}
.roster-toggle { font-size: 14px; color: var(--text2); margin-left: 8px; transition: transform 0.2s; }
.roster-toggle.open { transform: rotate(180deg); }
.roster-body {
  display: none; padding: 10px 12px 12px;
  border-top: 1px solid var(--border);
}
.roster-body.open { display: block; }
.rename-team-btn { display: none; font-size: 11px; color: var(--text2); background: transparent; border: none; cursor: pointer; padding: 0; text-decoration: underline; margin-bottom: 6px; }
.rename-team-btn.hs { display: block; width: 100%; }
.rename-team-btn:hover { color: var(--gold); }
.side-roster-title {
  font-size: 20px; color: var(--gold); letter-spacing: 1px;
  margin-bottom: 4px; text-align: center;
}
.side-roster-pts {
  font-size: 38px; color: var(--text);
  text-align: center; line-height: 1; margin-bottom: 8px;
}
.side-roster-pts-label { font-size: 16px; color: var(--text2); text-align: center; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.side-roster-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.side-players-label { font-size: 14px; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
.side-player { font-size: 17px; color: var(--text); padding: 6px 10px; border-radius: 4px; background: var(--panel); border: 1px solid var(--border); margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.remove-player { cursor: pointer; color: var(--text2); font-size: 14px; line-height: 1; display: none; }
.remove-player.hs { display: inline; }
.remove-player:hover { color: var(--red); }
.add-player-row { display: none; margin-top: 8px; flex-direction: column; gap: 6px; }
.add-player-row.hs { display: flex; }
.add-player-row input { width: 100%; background: var(--bg); border: 1px solid var(--border2); color: var(--text); padding: 5px 8px; border-radius: 4px; font-size: 12px; }
.add-player-row button { background: var(--panel2); border: 1px solid var(--border2); color: var(--gold); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; width: 100%; }
.add-player-row button:hover { border-color: var(--gold); }
.rename-team-btn { display: none; font-size: 11px; color: var(--text2); background: transparent; border: none; cursor: pointer; padding: 0; text-decoration: underline; margin-bottom: 6px; }
.rename-team-btn.hs { display: block; text-align: center; width: 100%; }
.rename-team-btn:hover { color: var(--gold); }

/* ADD TEAM SIDE */
#add-team-btn-side {
  display: none; margin: 10px 12px;
  background: var(--panel); border: 1px dashed var(--border2); color: var(--gold2);
  padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; text-align: center; width: calc(100% - 24px);
}
#add-team-btn-side.hs { display: block; }
#add-team-btn-side:hover { border-color: var(--gold); color: var(--gold); }

/* CENTER LADDER COLUMN */
.center-col { padding: 0 8px; min-width: 0; overflow: hidden; }

/* SCOREBOARD strip (compact, above ladder in center) */
#scoreboard-section { padding: 14px 0 10px; border-bottom: 1px solid var(--border); text-align: center; }
#scoreboard-section h2 { color: var(--gold); font-size: 22px; letter-spacing: 1px; margin-bottom: 10px; }

/* LADDER */
#ladder { padding: 18px 0; }
#ladder > h2 { color: var(--gold); font-size: 18px; letter-spacing: 1px; margin-bottom: 18px; text-align: center; }
.tier-section { margin-bottom: 24px; }

.tier-heading {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-radius: 6px 6px 0 0;
  border: 1px solid; border-bottom: none;
  font-size: 22px; letter-spacing: 1px;
}
.tier-heading .th-rank-img { width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; }
.tier-heading .th-name { flex: 1; }
.tier-heading .th-pts { font-size: 16px; opacity: 0.8; }

/* TASK GRID */
.task-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  border: 1px solid; border-radius: 0 0 6px 6px; overflow: hidden;
}

.task-card {
  background: var(--panel);
  padding: 12px 8px;
  display: flex; flex-direction: column; align-items: center;
  gap: 7px; text-align: center;
  min-height: 195px;
  min-width: 0;
  overflow: hidden;
  position: relative;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.task-card:hover { background: var(--panel2); }

/* Icon area */
.task-icons {
  display: flex; flex-wrap: wrap;
  justify-content: center; align-items: center;
  gap: 3px;
  width: 100%; flex-shrink: 0;
  min-height: 52px;
}
/* Single icon — centered and larger */
.task-icons.single {
  justify-content: center; align-items: center;
}
.task-icons.single img { width: 52px; height: 52px; }
/* Two icons */
.task-icons.two img { width: 42px; height: 42px; }
/* Three icons */
.task-icons.three img { width: 36px; height: 36px; }
/* Four icons: 2×2 grid */
.task-icons.four {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
  justify-items: center;
  align-items: center;
}
.task-icons.four img { width: 38px; height: 38px; }
/* Five icons: 3+2 */
.task-icons.five { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; justify-items: center; align-items: center; }
.task-icons.five img { width: 32px; height: 32px; }
/* Six icons: 2×3 grid */
.task-icons.six { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; justify-items: center; align-items: center; }
.task-icons.six img { width: 32px; height: 32px; }
/* More than 6: small wrap */
.task-icons.many img { width: 26px; height: 26px; }

.task-icons img {
  object-fit: contain; image-rendering: pixelated;
}

.task-name {
  font-size: 18px; color: var(--text); line-height: 1.3;
  flex: 1; display: flex; align-items: flex-start; justify-content: center;
  width: 100%; word-break: break-word; overflow-wrap: break-word;
}

/* Repeatable badge */
.repeat-badge {
  font-size: 14px; color: var(--text2); letter-spacing: 0.5px;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
  padding: 2px 7px;
}

.task-chips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; width: 100%; }
.chip {
  font-size: 13px; padding: 3px 8px; border-radius: 10px;
  border: 1px solid; line-height: 1.4; white-space: normal;
  word-break: break-word; max-width: 100%;
  transition: background 0.1s;
}
.chip.done { background: var(--green); border-color: #2a7a20; color: #fff; }
.chip.undone { background: transparent; border-color: var(--border2); color: var(--text2); }
.chip.hc { cursor: pointer; }
.chip.hc.done:hover { filter: brightness(1.15); }
.chip.hc.undone:hover { background: var(--panel2); color: var(--text); }
/* Team badge indicators */
.team-dots { display: flex; flex-direction: column; gap: 5px; align-items: stretch; margin-top: 6px; width: 100%; }
.team-badge {
  display: flex; align-items: center; gap: 6px;
  border-radius: 6px; padding: 4px 8px;
  font-size: 12px; font-weight: 600; cursor: default;
  border-left: 4px solid; background: rgba(0,0,0,0.35);
  transition: opacity 0.1s;
}
.team-badge.hc { cursor: pointer; }
.team-badge.hc:hover { opacity: 0.8; }
.team-badge.badge-undone { color: var(--text2); }
.team-badge.badge-done { color: #fff; }
.team-badge .badge-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.team-badge .badge-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-badge .badge-count {
  font-size: 13px; font-weight: 800; min-width: 16px; text-align: right;
}
.team-badge .badge-check { font-size: 13px; }
.rep-controls { display: flex; align-items: center; gap: 3px; }
.rep-controls .cnt-btn { width: 20px; height: 20px; font-size: 14px; padding: 0; line-height: 1; flex-shrink: 0; }
/* Repeatable: count chip */
.chip-count {
  font-size: 13px; padding: 3px 8px; border-radius: 10px;
  border: 1px solid; line-height: 1.4; white-space: normal;
  background: transparent; border-color: var(--border2); color: var(--text2);
  display: flex; align-items: center; gap: 4px;
  word-break: break-word; max-width: 100%;
}
.chip-count.has-completions { border-color: transparent !important; color: #fff !important; }
.chip-count-row { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
.chip-count-label { font-size: 13px; color: var(--text2); letter-spacing: 0.5px; word-break: break-word; max-width: 100%; }
.chip-count-controls { display: flex; align-items: center; gap: 6px; }
.cnt-btn {
  cursor: pointer; border: none; border-radius: 6px;
  font-family: inherit; font-weight: bold; font-size: 16px; line-height: 1;
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  transition: background 0.1s;
}
.cnt-minus { background: var(--red); color: #fff; }
.cnt-minus:hover { filter: brightness(1.2); }
.cnt-plus  { background: var(--green); color: #fff; }
.cnt-plus:hover  { filter: brightness(1.2); }


/* Add task card removed */

/* LOG */
#log-section { border-top: 1px solid var(--border); padding-top: 20px; margin-top: 8px; }
#log-section h2 { color: var(--gold); font-size: 22px; letter-spacing: 1px; margin-bottom: 10px; }
#log-list { list-style: none; }
#log-list li { padding: 8px 0; border-bottom: 1px solid var(--panel2); font-size: 16px; color: var(--text2); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
#log-list li .log-text { color: var(--text); flex: 1; }
.log-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.undo-btn { display: none; background: transparent; border: 1px solid var(--red); color: var(--red); padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.undo-btn.hs { display: inline-block; }
.undo-btn:hover { background: var(--red); color: #fff; }

/* MODALS */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border2); border-radius: 10px; padding: 24px; min-width: 300px; max-width: 92vw; }
.modal h2 { color: var(--gold); font-size: 18px; margin-bottom: 16px; letter-spacing: 1px; }
.modal input { width: 100%; background: var(--bg); border: 1px solid var(--border2); color: var(--text); padding: 9px 11px; border-radius: 5px; font-size: 14px; margin-bottom: 10px; }
.modal input:focus { outline: none; border-color: var(--gold); }
.modal-btns { display: flex; gap: 10px; margin-top: 6px; }
.btn { padding: 9px 18px; border-radius: 5px; cursor: pointer; font-size: 14px; border: none; }
.btn-gold { background: var(--gold2); color: #000; }
.btn-gold:hover { background: var(--gold); }
.btn-red { background: var(--red); color: #fff; }
.btn-red:hover { filter: brightness(1.15); }
.btn-gray { background: var(--panel2); color: var(--text); border: 1px solid var(--border2); }
.btn-gray:hover { background: var(--bg2); }
.err { color: #ff5555; font-size: 13px; margin-top: -6px; margin-bottom: 6px; display: none; }
.err.show { display: block; }

/* Tier header colors — matched to actual OSRS gem/rank icon colors */
/* Opal: milky white-blue iridescent */
.th-opal        { background:#0f1a1f; color:#c8e8f0; border-color:#3a6070; }
/* Jade: muted olive green */
.th-jade        { background:#0d1a0a; color:#7ab84a; border-color:#2a5018; }
/* Red Topaz: warm orange-red */
.th-topaz       { background:#200a00; color:#e85010; border-color:#602000; }
/* Sapphire: vivid royal blue */
.th-sapphire    { background:#040a22; color:#4878f0; border-color:#1030a0; }
/* Emerald: rich green */
.th-emerald     { background:#041a08; color:#20d050; border-color:#0a6020; }
/* Ruby: deep red */
.th-ruby        { background:#1e0204; color:#e81020; border-color:#780810; }
/* Diamond: bright icy white-blue */
.th-diamond     { background:#0e1418; color:#e0f0ff; border-color:#6090b0; }
/* Dragon: fiery orange-red */
.th-dragon      { background:#1e0600; color:#ff5500; border-color:#803000; }
/* Dragonstone: dark teal-blue */
.th-dragonstone { background:#040e18; color:#20b0c0; border-color:#106080; }
/* TzKal: volcanic orange */
.th-tzkal       { background:#1e0800; color:#ff7020; border-color:#903010; }
/* Onyx: dark grey with silver sheen */
.th-onyx        { background:#0a0a0a; color:#b0b8c0; border-color:#404850; }
/* Kitten: hot pink */
.th-kitten      { background:#1e0214; color:#f020a0; border-color:#800860; }
/* Maxed: gold */
.th-maxed       { background:#1a1400; color:#ffd700; border-color:#806800; }
/* Completionism: bright orange */
.th-completionism{background:#1e0800; color:#ff8800; border-color:#904000; }
/* Zenyte: deep orange-red with golden tint */
.th-zenyte      { background:#1e0400; color:#ff6020; border-color:#902010; }

.gb-opal        { border-color:#3a6070; }
.gb-jade        { border-color:#2a5018; }
.gb-topaz       { border-color:#602000; }
.gb-sapphire    { border-color:#1030a0; }
.gb-emerald     { border-color:#0a6020; }
.gb-ruby        { border-color:#780810; }
.gb-diamond     { border-color:#6090b0; }
.gb-dragon      { border-color:#803000; }
.gb-dragonstone { border-color:#106080; }
.gb-tzkal       { border-color:#903010; }
.gb-onyx        { border-color:#404850; }
.gb-kitten      { border-color:#800860; }
.gb-maxed       { border-color:#806800; }
.gb-completionism{border-color:#904000; }
.gb-zenyte      { border-color:#902010; }

@media (max-width: 960px) {
  .main-layout { grid-template-columns: 160px 1fr; }
  .side-player { font-size: 11px; }
}
@media (max-width: 700px) {
  .main-layout {
    display: flex; flex-direction: column;
    padding: 0 8px 60px;
  }
  #rosters-panel {
    position: static;
    flex-direction: row; gap: 10px; flex-wrap: wrap;
    justify-content: center; padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .side-roster { flex: 1; min-width: 130px; max-width: 200px; }
  .center-col { width: 100%; min-width: 0; }
  .task-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .task-card { min-height: 160px; }
  .task-name { font-size: 13px; }
  .tier-heading { font-size: 14px; }
  .chip { font-size: 12px; padding: 2px 6px; }
  .chip-count { font-size: 12px; padding: 2px 6px; }
  .chip-count-label { font-size: 12px; }
}
@media (max-width: 480px) {
  .task-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .task-card { min-height: 140px; }
  .task-icons.single img { width: 38px; height: 38px; }
  .task-icons.four img { width: 28px; height: 28px; }
  .chip { font-size: 11px; padding: 2px 5px; }
  .chip-count { font-size: 11px; padding: 2px 5px; }
}

/* Team colors */
:root {
  --team-0: #c03030;   /* red  */
  --team-1: #2060c0;   /* blue */
  --team-2: #20a050;   /* green */
  --team-3: #b060d0;   /* purple */
  --team-4: #d09020;   /* amber */
  --team-0-bg: rgba(192,48,48,.18);
  --team-1-bg: rgba(32,96,192,.18);
  --team-2-bg: rgba(32,160,80,.18);
  --team-3-bg: rgba(176,96,208,.18);
  --team-4-bg: rgba(208,144,32,.18);
  --both-bg: linear-gradient(135deg, rgba(192,48,48,.22) 50%, rgba(32,96,192,.22) 50%);
}
.team-color-0 { color: var(--team-0) !important; border-color: var(--team-0) !important; }
.team-color-1 { color: var(--team-1) !important; border-color: var(--team-1) !important; }
.team-color-2 { color: var(--team-2) !important; border-color: var(--team-2) !important; }
.team-color-3 { color: var(--team-3) !important; border-color: var(--team-3) !important; }
.team-color-4 { color: var(--team-4) !important; border-color: var(--team-4) !important; }
.chip.done.team-color-0 { background: #a02828 !important; color: #fff !important; border-color: #a02828 !important; }
.chip.done.team-color-1 { background: #1a52a8 !important; color: #fff !important; border-color: #1a52a8 !important; }
.chip.done.team-color-2 { background: #1a8840 !important; color: #fff !important; border-color: #1a8840 !important; }
.chip.done.team-color-3 { background: #9050b8 !important; color: #fff !important; border-color: #9050b8 !important; }

// completions: { taskId: { teamId: count (repeatable) | bool (non-repeatable) } }
const DEFAULT_STATE = {
  teams: [
    { id:'team_a', name:'Team Alpha', roster:[] },
    { id:'team_b', name:'Team Bravo', roster:[] },
  ],
  tasks: DEFAULT_TASKS,
  completions: {},
  log: [],
};

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let hostMode = false;
let editingTaskId = null;
let editingTaskTier = null;
let renamingTeamId = null;
let sbClient = null;

// ── SUPABASE ──────────────────────────────────────────────────────────────
function initSupabase() {
  try {
    if (window.supabase && window.supabase.createClient) {
      sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }
  } catch(e) {}
}

function mergeRemoteState(saved) {
  // Always re-root tasks on DEFAULT_TASKS so removed tasks never come back
  state = { ...DEFAULT_STATE, ...saved, tasks: DEFAULT_TASKS };
  for (const [k, arr] of Object.entries(saved.tasks || {})) {
    // Only keep host-added custom tasks (never old default IDs that were removed)
    const extras = arr.filter(t => t.id && t.id.startsWith('custom_'));
    if (extras.length) state.tasks[k] = [...(DEFAULT_TASKS[k]||[]), ...extras];
  }
  // Strip completion entries for tasks that no longer exist
  const allTaskIds = new Set(Object.values(state.tasks).flat().map(t=>t.id));
  for (const taskId of Object.keys(state.completions||{})) {
    if (!allTaskIds.has(taskId)) delete state.completions[taskId];
  }
}

async function loadFromSupabase() {
  if (!sbClient) return false;
  try {
    const { data, error } = await sbClient.from(TABLE).select('state').eq('id',1).single();
    if (error || !data) return false;
    mergeRemoteState(data.state);
    return true;
  } catch(e) { return false; }
}

async function saveToSupabase() {
  if (!sbClient) return;
  try {
    await sbClient.from(TABLE).upsert({ id:1, state: state, updated_at: new Date().toISOString() });
  } catch(e) {}
}

function subscribeRealtime() {
  if (!sbClient) return;
  sbClient.channel('ladder_changes')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:TABLE }, payload => {
      if (payload.new && payload.new.state) { mergeRemoteState(payload.new.state); renderAll(); }
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:TABLE }, payload => {
      if (payload.new && payload.new.state) { mergeRemoteState(payload.new.state); renderAll(); }
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') console.log('[LB] realtime connected');
    });
}

// ── PERSISTENCE ───────────────────────────────────────────────────────────

function wipeAll() {
  if (!confirm('Reset ALL scores, completions, and logs to default? This cannot be undone.')) return;
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  state.tasks = {};
  for (const [k, arr] of Object.entries(DEFAULT_TASKS)) {
    state.tasks[k] = arr.map(t => ({...t}));
  }
  localStorage.removeItem(LS_KEY);
  saveState();
  renderAll();
  addLog('🗑️ Host wiped all data — fresh start!');
}

function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
  saveToSupabase();
}
function loadState() {
  try {
    const s = localStorage.getItem(LS_KEY);
    if (s) {
      const saved = JSON.parse(s);
      // Always use DEFAULT_TASKS as the base; merge in any host-added custom tasks
      state = { ...DEFAULT_STATE, ...saved, tasks: DEFAULT_TASKS };
      // Only merge host-added custom tasks (never old default IDs that were removed)
      for (const [k, arr] of Object.entries(saved.tasks || {})) {
        const extras = arr.filter(t => t.id && t.id.startsWith('custom_'));
        if (extras.length) state.tasks[k] = [...(DEFAULT_TASKS[k]||[]), ...extras];
      }
      return true;
    }
  } catch(e) {}
  return false;
}

// ── POINTS ────────────────────────────────────────────────────────────────
function getTierPts(tierKey) {
  return (TIERS.find(t => t.key === tierKey) || {pts:0}).pts;
}
function getTaskTier(taskId) {
  for (const [tk, tasks] of Object.entries(state.tasks)) {
    if (tasks.find(t => t.id === taskId)) return tk;
  }
  return null;
}
function calcPoints(teamId) {
  let pts = 0;
  for (const [taskId, tmap] of Object.entries(state.completions)) {
    const val = tmap[teamId];
    if (!val) continue;
    const tierKey = getTaskTier(taskId);
    if (!tierKey) continue;
    const tierPts = getTierPts(tierKey);
    // find task
    const task = (state.tasks[tierKey] || []).find(t => t.id === taskId);
    if (!task) continue;
    if (task.repeatable) {
      const count = typeof val === 'number' ? val : 0;
      if (count > 0) pts += tierPts + (count - 1) * (tierPts / 2); // first = full, each after = half
    } else {
      pts += val ? tierPts : 0;
    }
  }
  return pts;
}

// ── AUTH ──────────────────────────────────────────────────────────────────
async function hashPassword(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function submitAuth() {
  const pw = document.getElementById('auth-pass').value;
  const h = await hashPassword(pw);
  if (h === PASSWORD_HASH) {
    hostMode = true;
    document.getElementById('host-banner').classList.add('active');
    document.getElementById('host-btn').textContent = '🔒 Exit Host';
    closeModal('auth-modal');
    renderAll();
  } else {
    document.getElementById('auth-err').classList.add('show');
  }
}

function addPlayer(teamId, name) {
  const t = state.teams.find(t=>t.id===teamId);
  if (!t || !name.trim()) return;
  if (!t.roster) t.roster = [];
  t.roster.push(name.trim());

}
function removePlayer(teamId, idx) {
  const t = state.teams.find(t=>t.id===teamId);
  if (!t || !t.roster) return;
  t.roster.splice(idx, 1);
  saveState(); renderAll();
}
function submitAddTeam() {
  const n = document.getElementById('addteam-name-input').value.trim();
  if (!n) return;
  state.teams.push({ id:'team_'+Date.now(), name:n, roster:[] });
  saveState(); renderAll();
  closeModal('addteam-modal');
}
function removeTeam(teamId) {
  const t = state.teams.find(t=>t.id===teamId);
  if (!t) return;
  if (!confirm(`Remove team "${t.name}" and all their completions? This cannot be undone.`)) return;
  state.teams = state.teams.filter(t=>t.id!==teamId);
  for (const taskId of Object.keys(state.completions)) {
    if (state.completions[taskId]) delete state.completions[taskId][teamId];
  }
  saveState(); renderAll();
  addLog(`🗑️ Team "${t.name}" removed by host.`);
}

// ── COMPLETION ────────────────────────────────────────────────────────────
function toggleCompletion(taskId, teamId) {
  if (!state.completions[taskId]) state.completions[taskId] = {};
  const tierKey = getTaskTier(taskId);
  const task = (state.tasks[tierKey]||[]).find(t=>t.id===taskId);
  if (!task) return;
  const team = state.teams.find(t=>t.id===teamId);
  const teamName = team ? team.name : teamId;

  if (task.repeatable) {
    return; // repeatable handled by addRepeatableCompletion / removeRepeatableCompletion
  } else {
    const cur = !!state.completions[taskId][teamId];
    state.completions[taskId][teamId] = !cur;
    const pts = getTierPts(tierKey);
    addLog(state.completions[taskId][teamId]
      ? `✅ ${teamName} completed "${task.name}" (+${pts} pts)`
      : `↩️ ${teamName} undid "${task.name}" (-${pts} pts)`);
  }
  saveState(); renderAll();
}

function addRepeatableCompletion(taskId, teamId) {
  if (!hostMode) return;
  if (!state.completions[taskId]) state.completions[taskId] = {};
  const tierKey = getTaskTier(taskId);
  const task = (state.tasks[tierKey]||[]).find(t=>t.id===taskId);
  if (!task || !task.repeatable) return;
  const cur = state.completions[taskId][teamId] || 0;
  state.completions[taskId][teamId] = cur + 1;
  const fullPts = getTierPts(tierKey);
  const earnedPts = cur === 0 ? fullPts : fullPts / 2;
  const team = state.teams.find(t=>t.id===teamId);
  const teamName = team ? team.name : teamId;
  addLog(`✅ ${teamName} completed "${task.name}" x${cur+1} (+${earnedPts} pts${cur > 0 ? ' ½' : ''})`);
  saveState(); renderAll();
}

function removeRepeatableCompletion(taskId, teamId) {
  if (!hostMode) return;
  if (!state.completions[taskId]) return;
  const tierKey = getTaskTier(taskId);
  const task = (state.tasks[tierKey]||[]).find(t=>t.id===taskId);
  if (!task || !task.repeatable) return;
  const cur = state.completions[taskId][teamId] || 0;
  if (cur <= 0) return;
  state.completions[taskId][teamId] = cur - 1;
  const fullPts = getTierPts(tierKey);
  const removedPts = cur === 1 ? fullPts : fullPts / 2;
  const team = state.teams.find(t=>t.id===teamId);
  const teamName = team ? team.name : teamId;
  addLog(`↩️ ${teamName} undid "${task.name}" (−${removedPts} pts)`);
  saveState(); renderAll();
}

function addLog(text) {
  state.log.unshift({ id: Date.now()+'_'+Math.random(), ts: Date.now(), text });
  if (state.log.length > 100) state.log.length = 100;
}

// ── COUNTDOWN ─────────────────────────────────────────────────────────────
function updateCountdown() {
  const el = document.getElementById('countdown-digits');
  const now = new Date();
  const diff = BINGO_START - now;
  if (diff <= 0) {
    el.innerHTML = '<span class="started-msg">🔥 BINGO IS LIVE! 🔥</span>';
    return;
  }
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  el.innerHTML = [
    ['Days',d],['Hours',h],['Mins',m],['Secs',s]
  ].map(([l,v])=>`<div class="cd-unit"><span class="cd-num">${String(v).padStart(2,'0')}</span><div class="cd-label">${l}</div></div>`).join('');
}
setInterval(updateCountdown, 1000);
updateCountdown();

  if (n===1) return 'single';
  if (n===2) return 'two';
  if (n===3) return 'three';
  if (n===4) return 'four';
  if (n===5) return 'five';
  if (n===6) return 'six';
  return 'many';
}

        ${playersHtml || '<div style="font-size:13px;color:var(--text2);text-align:center;padding:4px 0">No players yet</div>'}
        <div class="add-player-row ${hs}" id="add-row-${team.id}">
          <input type="text" placeholder="IGN" id="add-input-${team.id}" />
          <button onclick="doAddPlayer('${team.id}')">+ Add</button>
        </div>
      </div>
    </div>`;
  });
  if (hostMode) {
    html += `<button style="width:100%;margin-top:6px;background:var(--panel);border:1px dashed var(--border2);color:var(--gold2);padding:8px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:bold;" onclick="document.getElementById('addteam-name-input').value='';openModal('addteam-modal')">+ Add Team</button>`;
  }
  panel.innerHTML = html;
}

function toggleRoster(teamId) {
  const body = document.querySelector(`.roster-body[data-team-id="${teamId}"]`);
  const toggle = body ? body.previousElementSibling.querySelector('.roster-toggle') : null;
  if (body) body.classList.toggle('open');
  if (toggle) toggle.classList.toggle('open');
}

function doAddPlayer(teamId) {
  const el = document.getElementById(`add-input-${teamId}`);
  if (el) { addPlayer(teamId, el.value); el.value = ''; }
}


function renderLadder() {
  const ladder = document.getElementById('ladder');
  // keep h2
  let html = '<h2>⚔️ The Ladder</h2>';
  for (const tier of TIERS) {
    const tasks = state.tasks[tier.key] || [];
    html += `<div class="tier-section">
      <div class="tier-heading th-${tier.key}">
        <img class="th-rank-img" src="${tier.rankImg}" onerror="this.style.display='none'" loading="lazy" alt="${tier.name} rank">
        <span class="th-name">${tier.name}</span>
        <span class="th-pts">${tier.ptsLabel}</span>
      </div>
      <div class="task-grid gb-${tier.key}">`;
    for (const task of tasks) {
      html += renderTaskCard(task, tier.key);
    }
    html += '</div></div>';
  }
  ladder.innerHTML = html;
}

function teamColorClass(teamIdx) {
  return `team-color-${teamIdx}`;
}

function renderTaskCard(task, tierKey) {
  const n = task.imgs ? task.imgs.length : 0;
  const cls = iconClass(n);
  const iconsHtml = (task.imgs||[]).map(url =>
    `<img src="${url}" loading="lazy" onerror="this.style.display='none'" alt="">`
  ).join('');

  // Repeatable badge
  const repBadge = task.repeatable ? `<span class="repeat-badge">Repeatable</span>` : '';

  // Figure out which teams completed this task (for card background)
  const completedByIdx = [];
  state.teams.forEach((team, idx) => {
    const comp = (state.completions[task.id]||{})[team.id];
    const isDone = task.repeatable
      ? (comp > 0)          // works for numbers AND booleans (true > 0 is true)
      : !!comp;
    if (isDone) completedByIdx.push(idx);
  });
  let cardExtraClass = '';
  let cardExtraStyle = '';
  const TEAM_COLORS_RGB = ['192,48,48','32,96,192','32,160,80','176,96,208','208,144,32'];
  const TEAM_COLORS_SOLID = ['#a02828','#1a52a8','#1a8840','#9050b8','#b07818'];
  if (completedByIdx.length === 1) {
    const rgb = TEAM_COLORS_RGB[completedByIdx[0]] || '180,180,180';
    cardExtraStyle = `background:rgba(${rgb},.22)!important;`;
  } else if (completedByIdx.length >= 2) {
    // Build a diagonal gradient with one equal slice per completing team
    const pct = 100 / completedByIdx.length;
    const stops = [];
    completedByIdx.forEach((teamIdx, i) => {
      const rgb = TEAM_COLORS_RGB[teamIdx] || '180,180,180';
      const a = (i * pct).toFixed(1);
      const b = ((i + 1) * pct).toFixed(1);
      stops.push(`rgba(${rgb},.28) ${a}%`, `rgba(${rgb},.28) ${b}%`);
    });
    cardExtraStyle = `background:linear-gradient(135deg,${stops.join(',')})!important;`;
  }

  // Badges per team
  let chipsHtml = '<div class="team-dots">';
  state.teams.forEach((team, idx) => {
    const solidColor = TEAM_COLORS_SOLID[idx] || '#555';
    const comp = (state.completions[task.id]||{})[team.id];
    if (task.repeatable) {
      const count = typeof comp === 'number' ? comp : 0;
      const hasDone = count > 0;
      const badgeClass = hasDone ? 'badge-done' : 'badge-undone';
      // dot: filled when has completions, outlined (like non-repeatable undone) when 0
      const dotStyle = hasDone
        ? `background:${solidColor}`
        : `background:transparent;border:2px solid ${solidColor}`;
      // right side: count when > 0, nothing when 0
      const rightHtml = hasDone ? `<span class="badge-count" style="color:${solidColor}">${count}</span>` : '';
      if (hostMode) {
        chipsHtml += `<div class="team-badge ${badgeClass}" style="border-color:${solidColor};background:rgba(0,0,0,0.35)">
          <div class="badge-dot" style="${dotStyle}"></div>
          <span class="badge-label">${team.name}</span>
          <div class="rep-controls">
            <button class="cnt-btn cnt-minus" onclick="removeRepeatableCompletion('${task.id}','${team.id}')" title="−1">−</button>
            ${rightHtml || `<span class="badge-count" style="color:var(--text2)">0</span>`}
            <button class="cnt-btn cnt-plus" onclick="addRepeatableCompletion('${task.id}','${team.id}')" title="+1">+</button>
          </div>
        </div>`;
      } else {
        chipsHtml += `<div class="team-badge ${badgeClass}" style="border-color:${solidColor};background:rgba(0,0,0,0.35)">
          <div class="badge-dot" style="${dotStyle}"></div>
          <span class="badge-label">${team.name}</span>
          ${rightHtml}
        </div>`;
      }
    } else {
      const done = !!comp;
      const click = hostMode ? `onclick="toggleCompletion('${task.id}','${team.id}')"` : '';
      const titleText = done ? (hostMode ? `Click to undo — ${team.name}` : `${team.name}: complete`) : (hostMode ? `Mark ${team.name} complete` : `${team.name}: incomplete`);
      chipsHtml += `<div class="team-badge ${done?'badge-done':'badge-undone'} ${hostMode?'hc':''}" style="border-color:${solidColor};background:rgba(0,0,0,0.35)" ${click} title="${titleText}">
        <div class="badge-dot" style="background:${done?solidColor:'transparent'};border:2px solid ${solidColor}"></div>
        <span class="badge-label">${team.name}</span>
        ${done ? `<span class="badge-check" style="color:${solidColor}">✓</span>` : ''}
      </div>`;
    }
  });
  chipsHtml += '</div>';

  return `<div class="task-card ${cardExtraClass}" style="${cardExtraStyle}">
    <div class="task-icons ${cls}">${iconsHtml}</div>
    <div class="task-name">${task.name}</div>
    ${repBadge}
    ${chipsHtml}
  </div>`;
}

function renderLog() {
  const ul = document.getElementById('log-list');
  if (!state.log || state.log.length === 0) {
    ul.innerHTML = '<li><span class="log-text" style="color:var(--text2)">No completions yet.</span></li>';
    return;
  }
  ul.innerHTML = state.log.slice(0,30).map(e => {
    const d = new Date(e.ts);
    const ts = d.toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<li><span class="log-text">${e.text}</span><span class="log-meta"><span style="font-size:11px;color:var(--text2)">${ts}</span></span></li>`;
  }).join('');
}

// ── INIT ──────────────────────────────────────────────────────────────────
async function init() {
  loadState();
  renderAll();
  // Load Supabase async — never block render
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  script.onload = async () => {
    initSupabase();
    const fromDb = await loadFromSupabase();
    if (fromDb) renderAll();
    subscribeRealtime();
  };
  script.onerror = () => {}; // offline fallback — localStorage already loaded
  document.head.appendChild(script);
}
init();

// ── BACKGROUND BOUNCING ICONS ─────────────────────────────────────────────
(function startBgIcons() {
  const allImgs = [];
  const seen = new Set();
  for (const tier of Object.values(DEFAULT_TASKS)) {
    for (const task of tier) {
      for (const url of (task.imgs || [])) {
        if (!seen.has(url)) { seen.add(url); allImgs.push(url); }
      }
    }
  }
  if (!allImgs.length) return;

  const container = document.createElement('div');
  container.id = 'bg-icons';
  container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:0;';
  document.body.insertBefore(container, document.body.firstChild);

  const COUNT = 50;
  const SIZE = 42;
  const icons = [];

  for (let i = 0; i < COUNT; i++) {
    const url = allImgs[i % allImgs.length];
    const el = document.createElement('img');
    el.src = url;
    el.style.cssText = 'position:absolute;width:' + SIZE + 'px;height:' + SIZE + 'px;object-fit:contain;opacity:0.28;image-rendering:pixelated;will-change:transform;';
    el.onerror = function() { this.style.display='none'; };
    container.appendChild(el);
    const vw = window.innerWidth, vh = window.innerHeight;
    const ic = {
      el,
      x: Math.random() * (vw - SIZE),
      y: Math.random() * (vh - SIZE),
      vx: (Math.random() * 0.5 + 0.2) * (Math.random() < 0.5 ? 1 : -1),
      vy: (Math.random() * 0.5 + 0.2) * (Math.random() < 0.5 ? 1 : -1),
    };
    el.style.transform = 'translate(' + ic.x + 'px,' + ic.y + 'px)';
    icons.push(ic);
  }

  function tick() {
    const vw = window.innerWidth, vh = window.innerHeight;
    for (const ic of icons) {
      ic.x += ic.vx; ic.y += ic.vy;
      if (ic.x <= 0)         { ic.x = 0;         ic.vx =  Math.abs(ic.vx); }
      if (ic.x >= vw - SIZE) { ic.x = vw - SIZE; ic.vx = -Math.abs(ic.vx); }
      if (ic.y <= 0)         { ic.y = 0;         ic.vy =  Math.abs(ic.vy); }
      if (ic.y >= vh - SIZE) { ic.y = vh - SIZE; ic.vy = -Math.abs(ic.vy); }
      ic.el.style.transform = 'translate(' + ic.x.toFixed(1) + 'px,' + ic.y.toFixed(1) + 'px)';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
